<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h1>Agenda de Clientes</h1>
        </div>
        <div class = "nav-links">
            <a href="/">🏠Home</a>
            <a href="/adicionar-cliente.html">➕ Adicionar Cliente</a>
        </div>
    </nav>
    <header>
        <h1>Gestão de Clientes e Contatos</h1>
    </header>
    <div class="cliente-card">
        <div class="container">
            <div class="cliente-list">
                <h2>Lista de Clientes</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Data de Nascimento</th>
                            <th>Endereço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientes">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Cliente</h2>
                <span class="modal-close">&times;</span>
            </div>
            <form id="formEditarCliente" novalidate>
                <input type="hidden" id="editarId" name="id">
                <div class="form-group">
                    <label for="editarNome">Nome *</label>
                    <input type="text" id="editarNome" name="nome" placeholder="Digite o nome do cliente" required>
                </div>
                <div class="form-group">
                    <label for="editarCpf">CPF *</label>
                    <input type="text" id="editarCpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label for="editarDataNascimento">Data de Nascimento *</label>
                    <input type="date" id="editarDataNascimento" name="dataNascimento" required>
                </div>
                <div class="form-group">
                    <label for="editarEndereco">Endereço</label>
                    <input type="text" id="editarEndereco" name="endereco" placeholder="Digite o endereço do cliente">
                </div>
                <div class="form-actions">
                    <button type="button" id="btnCancelarEditar">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/cliente.js"></script>
    <script src="js/contato.js"></script>
    </body>
</html>
