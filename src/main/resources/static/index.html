<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h1>Agenda de Clientes</h1>
        </div>
        <div class = "nav-links">
            <a href="/">🏠Home</a>
            <a href="/adicionar-cliente.html">➕ Adicionar Cliente</a>
        </div>
    </nav>
    <header>
        <h1>Gestão de Clientes e Contatos</h1>
    </header>
    <div class="cliente-card">
        <div class="container">
            <div class="cliente-list">
                <div class="header-list">
                    <h2>Lista de Clientes</h2>
                    <div class="search-container">
                        <input type="text" id="campoBusca" placeholder="Buscar por nome ou CPF..." class="search-input">
                        <button type="button" id="btnBuscar" class="btn-buscar">🔍 Buscar</button>
                        <button type="button" id="btnLimparBusca" class="btn-limpar" style="display: none;">Limpar</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Data de Nascimento</th>
                            <th>Endereço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientes">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Cliente</h2>
                <span class="modal-close">&times;</span>
            </div>
            <form id="formEditarCliente" novalidate>
                <input type="hidden" id="editarId" name="id">
                <div class="form-group">
                    <label for="editarNome">Nome *</label>
                    <input type="text" id="editarNome" name="nome" placeholder="Digite o nome do cliente" required>
                </div>
                <div class="form-group">
                    <label for="editarCpf">CPF *</label>
                    <input type="text" id="editarCpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label for="editarDataNascimento">Data de Nascimento *</label>
                    <input type="date" id="editarDataNascimento" name="dataNascimento" required>
                </div>
                <div class="form-group">
                    <label for="editarEndereco">Endereço</label>
                    <input type="text" id="editarEndereco" name="endereco" placeholder="Digite o endereço do cliente">
                </div>
                <div class="form-actions">
                    <button type="button" id="btnCancelarEditar">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Adicionar Contato -->
    <div id="modalAdicionarContato" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Adicionar Contato</h2>
                <span class="modal-close-contato">&times;</span>
            </div>
            <form id="formAdicionarContato" novalidate>
                <input type="hidden" id="contatoClienteId" name="clienteId">
                <div class="form-group">
                    <label>Cliente: <strong id="contatoClienteNome"></strong></label>
                </div>
                <div class="form-group">
                    <label for="contatoTipo">Tipo de Contato *</label>
                    <select id="contatoTipo" name="tipoContato" required>
                        <option value="">Selecione o tipo</option>
                        <option value="TELEFONE">Telefone</option>
                        <option value="EMAIL">E-mail</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contatoValor">Valor do Contato *</label>
                    <input type="text" id="contatoValor" name="valorContato" placeholder="Digite o telefone ou e-mail" required>
                </div>
                <div class="form-group">
                    <label for="contatoObservacao">Observação</label>
                    <input type="text" id="contatoObservacao" name="observacao" placeholder="Digite uma observação (opcional)">
                </div>
                <div class="form-actions">
                    <button type="button" id="btnCancelarContato">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Ver Contatos -->
    <div id="modalVerContatos" class="modal">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <h2>Contatos de <span id="clienteNomeHeader"></span></h2>
                <span class="modal-close-ver-contatos">&times;</span>
            </div>
            <div class="modal-body">
                <table>
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Observação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyContatos">
                    </tbody>
                </table>
            </div>
            <div class="form-actions">
                <button type="button" id="btnFecharContatos">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Editar Contato -->
    <div id="modalEditarContato" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Contato</h2>
                <span class="modal-close-editar-contato">&times;</span>
            </div>
            <form id="formEditarContato" novalidate>
                <input type="hidden" id="editarContatoId" name="id">
                <input type="hidden" id="editarContatoClienteId" name="clienteId">
                <div class="form-group">
                    <label>Cliente: <strong id="editarContatoClienteNome"></strong></label>
                </div>
                <div class="form-group">
                    <label for="editarContatoTipo">Tipo de Contato *</label>
                    <select id="editarContatoTipo" name="tipoContato" required>
                        <option value="">Selecione o tipo</option>
                        <option value="TELEFONE">Telefone</option>
                        <option value="EMAIL">E-mail</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editarContatoValor">Valor do Contato *</label>
                    <input type="text" id="editarContatoValor" name="valorContato" placeholder="Digite o telefone ou e-mail" required>
                </div>
                <div class="form-group">
                    <label for="editarContatoObservacao">Observação</label>
                    <input type="text" id="editarContatoObservacao" name="observacao" placeholder="Digite uma observação (opcional)">
                </div>
                <div class="form-actions">
                    <button type="button" id="btnCancelarEditarContato">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/cliente.js"></script>
    <script src="js/app.js"></script>
    </body>
</html>
