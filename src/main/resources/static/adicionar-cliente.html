<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Cliente</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h1>Agenda de Clientes</h1>
        </div>
        <div class = "nav-links">
            <a href="/">🏠Home</a>
            <a href="/adicionar-cliente.html">➕ Adicionar Cliente</a>
        </div>
    </nav>
    <div class="container">
        <header>
            <div class="cliente-card">
                <h1>Adicionar Cliente</h1>
                <form id="formCliente" novalidate>
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o nome do cliente" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento *</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" required>
                    </div>
                    <div class="form-group">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Digite o endereço do cliente">
                    </div>
                    <div class="form-actions">
                        <button type="button" onclick="window.location.href='/'">Cancelar</button>
                        <button type="submit">Salvar</button>
                    </div>
                </form>
            </div>
        </header>
    </div>
    <script src="/js/cliente.js"></script>
</body>
</html>
